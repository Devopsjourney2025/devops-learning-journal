apiVersion: apps/v1
kind: ReplicaSet 
metadata:
  name: nginx-replicaset
  labels:
    app: nginx
spec:
  selector:
    matchLabels:
      app: nginx
      type: frontend
  replicas: 3
  template:
    metadata:
      labels:
        app: nginx
        type: frontend
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
    